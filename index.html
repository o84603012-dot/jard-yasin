async function makePdf(only){
var pages=await drawPages(only),enc=new TextEncoder(),chunks=[],off=0,offs=[];
function put(x){var b=typeof x==="string"?enc.encode(x):x;chunks.push(b);off+=b.length;}
put("%PDF-1.4\n");
offs[1]=off;put("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
var n=pages.length,kids=[];for(var i=0;i<n;i++)kids.push((5+3*i)+" 0 R");
offs[2]=off;put("2 0 obj\n<</Type/Pages/Kids["+kids.join(" ")+"]/Count "+n+">>\nendobj\n");
for(var j=0;j<n;j++){
var jb=await new Promise(function(r){pages[j].toBlob(r,"image/jpeg",0.9);}),bytes=new Uint8Array(await jb.arrayBuffer());
var im=3+3*j,ct=4+3*j,pg=5+3*j,cs="q 595 0 0 842 0 0 cm /Im0 Do Q";
offs[im]=off;put(im+" 0 obj\n<</Type/XObject/Subtype/Image/Width "+PW+"/Height "+PH+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+bytes.length+">>\nstream\n");put(bytes);put("\nendstream\nendobj\n");
offs[ct]=off;put(ct+" 0 obj\n<</Length "+cs.length+">>\nstream\n"+cs+"\nendstream\nendobj\n");
offs[pg]=off;put(pg+" 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 "+im+" 0 R>>>>/Contents "+ct+" 0 R>>\nendobj\n");}
var N=3+3*n,xo=off,x="xref\n0 "+N+"\n0000000000 65535 f \n";
for(var k=1;k<N;k++)x+=("0000000000"+offs[k]).slice(-10)+" 00000 n \n";
put(x+"trailer\n<</Size "+N+"/Root 1 0 R>>\nstartxref\n"+xo+"\n%%EOF");
return new Blob(chunks,{type:"application/pdf"});}
